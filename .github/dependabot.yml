version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      dev-dependencies-minor-patch:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # eslint-config-athom@4 peers on eslint 8; revisit when athom supports 9+
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      # typescript-eslint (via eslint-config-athom) is on TypeScript 6
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Must match the Homey runtime (Node 22)
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns: ["*"]
